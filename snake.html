<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake IA Auto</title>
  <style>
    :root {
      --bg-1: #071019;
      --bg-2: #0d1b29;
      --panel: rgba(17, 24, 39, 0.88);
      --panel-border: rgba(148, 163, 184, 0.16);
      --text: #edf6ff;
      --muted: #a4bfd6;
      --accent: #70f7c7;
      --accent-2: #6ee7ff;
      --food: #ff5a7f;
      --board: #0b1420;
      --snake-head: #8af7d4;
      --snake-body: #46d9b2;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(110, 231, 255, 0.12), transparent 20%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2));
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
    }

    .wrapper {
      width: min(92vw, 560px);
      padding: 18px 18px 14px;
      border-radius: 22px;
      border: 1px solid var(--panel-border);
      background: var(--panel);
      box-shadow:
        0 28px 80px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(8px);
    }

    .hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding: 0 4px;
    }

    .title {
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--muted);
    }

    .score-box {
      min-width: 124px;
      text-align: right;
      padding: 8px 12px;
      border-radius: 12px;
      background: rgba(112, 247, 199, 0.08);
      border: 1px solid rgba(112, 247, 199, 0.2);
      box-shadow: inset 0 0 18px rgba(112, 247, 199, 0.04);
    }

    .score-label {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .score-value {
      font-size: clamp(1.2rem, 2.4vw, 1.8rem);
      font-weight: 800;
      color: var(--accent);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 16px;
      background: linear-gradient(180deg, var(--board), #0c121b);
      border: 1px solid rgba(148, 163, 184, 0.12);
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.35);
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="hud">
      <div class="title">Snake IA</div>
      <div class="score-box">
        <span class="score-label">Pontuação</span>
        <span class="score-value" id="score">0</span>
      </div>
    </div>
    <canvas id="game" width="432" height="432" aria-label="Jogo da cobra"></canvas>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");

    const gridSize = 18;
    const cellSize = canvas.width / gridSize;
    const DIRS = [
      { x: 1, y: 0 },
      { x: -1, y: 0 },
      { x: 0, y: 1 },
      { x: 0, y: -1 }
    ];

    const state = {
      snake: [],
      food: { x: 0, y: 0 },
      score: 0,
      gameOver: false,
      tickTimer: null
    };

    function keyOf(x, y) {
      return `${x},${y}`;
    }

    function clonePos(pos) {
      return { x: pos.x, y: pos.y };
    }

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function updateScore() {
      scoreEl.textContent = String(state.score);
    }

    function resetSnake() {
      state.snake = [
        { x: 8, y: 9 },
        { x: 7, y: 9 },
        { x: 6, y: 9 }
      ];
    }

    function placeFood() {
      const occupied = new Set(state.snake.map(seg => keyOf(seg.x, seg.y)));
      const freeCells = [];

      for (let y = 0; y < gridSize; y++) {
        for (let x = 0; x < gridSize; x++) {
          if (!occupied.has(keyOf(x, y))) {
            freeCells.push({ x, y });
          }
        }
      }

      if (freeCells.length === 0) {
        return false;
      }

      const chosen = freeCells[randomInt(0, freeCells.length - 1)];
      state.food = { x: chosen.x, y: chosen.y };
      return true;
    }

    function isOccupied(cell, allowTailVacate) {
      for (let i = 0; i < state.snake.length; i++) {
        const seg = state.snake[i];
        if (seg.x === cell.x && seg.y === cell.y) {
          const isTail = i === state.snake.length - 1;
          if (isTail && allowTailVacate) {
            return false;
          }
          return true;
        }
      }
      return false;
    }

    function isMoveValid(nextHead, allowTailVacate) {
      if (nextHead.x < 0 || nextHead.y < 0 || nextHead.x >= gridSize || nextHead.y >= gridSize) {
        return false;
      }
      return !isOccupied(nextHead, allowTailVacate);
    }

    function manhattan(a, b) {
      return Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
    }

    function shortestPathLength(start, target, allowTailVacate) {
      const queue = [clonePos(start)];
      const visited = new Set([keyOf(start.x, start.y)]);
      const distance = new Map([[keyOf(start.x, start.y), 0]]);

      while (queue.length > 0) {
        const current = queue.shift();
        if (current.x === target.x && current.y === target.y) {
          return distance.get(keyOf(current.x, current.y));
        }

        for (const dir of DIRS) {
          const next = { x: current.x + dir.x, y: current.y + dir.y };
          const nextKey = keyOf(next.x, next.y);

          if (next.x < 0 || next.y < 0 || next.x >= gridSize || next.y >= gridSize) {
            continue;
          }

          if (visited.has(nextKey)) {
            continue;
          }

          if (isOccupied(next, allowTailVacate)) {
            continue;
          }

          visited.add(nextKey);
          distance.set(nextKey, distance.get(keyOf(current.x, current.y)) + 1);
          queue.push(next);
        }
      }

      return Infinity;
    }

    function floodFillSafeCells(start, allowTailVacate) {
      const queue = [clonePos(start)];
      const visited = new Set([keyOf(start.x, start.y)]);
      let count = 0;

      while (queue.length > 0) {
        const current = queue.shift();
        count++;

        for (const dir of DIRS) {
          const next = { x: current.x + dir.x, y: current.y + dir.y };
          const nextKey = keyOf(next.x, next.y);

          if (next.x < 0 || next.y < 0 || next.x >= gridSize || next.y >= gridSize) {
            continue;
          }

          if (visited.has(nextKey)) {
            continue;
          }

          if (isOccupied(next, allowTailVacate)) {
            continue;
          }

          visited.add(nextKey);
          queue.push(next);
        }
      }

      return count;
    }

    function chooseAIMove() {
      const head = state.snake[0];
      const options = [];

      for (const dir of DIRS) {
        const nextHead = {
          x: head.x + dir.x,
          y: head.y + dir.y
        };

        const willEat = nextHead.x === state.food.x && nextHead.y === state.food.y;
        const allowTailVacate = !willEat;

        if (!isMoveValid(nextHead, allowTailVacate)) {
          continue;
        }

        const distanceToFood = manhattan(nextHead, state.food);
        const pathLength = shortestPathLength(nextHead, state.food, allowTailVacate);
        const safeCells = floodFillSafeCells(nextHead, allowTailVacate);

        options.push({
          dir,
          willEat,
          distanceToFood,
          pathLength,
          safeCells
        });
      }

      if (options.length === 0) {
        return null;
      }

      options.sort((a, b) => {
        if (a.willEat !== b.willEat) {
          return a.willEat ? -1 : 1;
        }

        if (a.pathLength !== b.pathLength) {
          return a.pathLength - b.pathLength;
        }

        if (a.distanceToFood !== b.distanceToFood) {
          return a.distanceToFood - b.distanceToFood;
        }

        if (a.safeCells !== b.safeCells) {
          return b.safeCells - a.safeCells;
        }

        return 0;
      });

      return options[0].dir;
    }

    function triggerRestart() {
      state.gameOver = true;
      clearInterval(state.tickTimer);

      setTimeout(() => {
        resetGame();
      }, 1100);
    }

    function resetGame() {
      clearInterval(state.tickTimer);
      state.score = 0;
      state.gameOver = false;
      resetSnake();
      placeFood();
      updateScore();
      draw();
      state.tickTimer = setInterval(gameStep, 120);
    }

    function gameStep() {
      if (state.gameOver) {
        return;
      }

      const move = chooseAIMove();
      if (!move) {
        triggerRestart();
        return;
      }

      const head = state.snake[0];
      const nextHead = {
        x: head.x + move.x,
        y: head.y + move.y
      };

      const willEat = nextHead.x === state.food.x && nextHead.y === state.food.y;

      if (!isMoveValid(nextHead, !willEat)) {
        triggerRestart();
        return;
      }

      state.snake.unshift(nextHead);

      if (willEat) {
        state.score += 10;
        if (!placeFood()) {
          triggerRestart();
          return;
        }
      } else {
        state.snake.pop();
      }

      updateScore();
      draw();
    }

    function drawGrid() {
      ctx.fillStyle = "#0b1420";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let y = 0; y < gridSize; y++) {
        for (let x = 0; x < gridSize; x++) {
          ctx.fillStyle = (x + y) % 2 === 0 ? "rgba(148, 163, 184, 0.05)" : "rgba(148, 163, 184, 0.02)";
          ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
        }
      }
    }

    function drawFood() {
      const cx = state.food.x * cellSize + cellSize / 2;
      const cy = state.food.y * cellSize + cellSize / 2;
      const r = cellSize * 0.34;

      ctx.beginPath();
      ctx.fillStyle = "#ff5a7f";
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.fillStyle = "rgba(255,255,255,0.2)";
      ctx.arc(cx - r * 0.28, cy - r * 0.28, r * 0.25, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawSnake() {
      state.snake.forEach((seg, index) => {
        const x = seg.x * cellSize;
        const y = seg.y * cellSize;
        const isHead = index === 0;
        const padding = isHead ? 2 : 4;

        ctx.fillStyle = isHead ? "#8af7d4" : "#46d9b2";
        ctx.fillRect(x + padding, y + padding, cellSize - padding * 2, cellSize - padding * 2);

        if (isHead) {
          ctx.fillStyle = "#0f172a";
          const eyeSize = cellSize * 0.09;
          const eyeY = y + cellSize * 0.34;
          const leftEyeX = x + cellSize * 0.34;
          const rightEyeX = x + cellSize * 0.62;
          ctx.fillRect(leftEyeX, eyeY, eyeSize, eyeSize);
          ctx.fillRect(rightEyeX, eyeY, eyeSize, eyeSize);
        }
      });
    }

    function draw() {
      drawGrid();
      drawFood();
      drawSnake();
    }

    resetGame();
  </script>
</body>
</html>
